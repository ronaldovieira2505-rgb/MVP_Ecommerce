name: Claude

# Gatilhos:
#  - label "pronta-para-claude" aplicado a uma issue -> Claude implementa a US e abre branch/PR
#  - comentário com "@claude" em issue ou PR        -> Claude responde / ajusta o PR
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Uma execução por issue/PR de cada vez (protege a cota da assinatura).
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'pronta-para-claude') ||
      (github.event_name != 'issues' && github.event.sender.type != 'Bot' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          # Autenticação pela assinatura (secret criado pelo /install-github-app)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "pronta-para-claude"
          additional_permissions: |
            actions: read
          # sonnet = mais leve para a cota do plano Pro. Troque por opus só em US difíceis.
          claude_args: |
            --model sonnet
            --max-turns 25
