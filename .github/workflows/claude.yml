name: Claude

# Gatilhos:
#  - label "pronta-para-claude" aplicado a uma issue -> Claude implementa a US e cria a branch
#  - comentário com "@claude" em issue ou PR        -> Claude responde / ajusta o PR
on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# Uma execução por issue/PR de cada vez (protege a cota da assinatura).
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'pronta-para-claude') ||
      (github.event_name != 'issues' && github.event.sender.type != 'Bot' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    # Banco de dados para o Claude rodar os testes antes de entregar (igual ao CI)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conectaja
          POSTGRES_PASSWORD: conectaja
          POSTGRES_DB: conectaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conectaja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://conectaja:conectaja@localhost:5432/conectaja
      SECRET_KEY: claude-only-not-a-secret
      DEBUG: "true"
      ALLOWED_HOSTS: "*"

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: anthropics/claude-code-action@v1
        with:
          # Autenticação pela assinatura (secret criado pelo /install-github-app)
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          label_trigger: "pronta-para-claude"
          additional_permissions: |
            actions: read
          # Repositório público: o Claude só considera comentários do time (e os dele),
          # para que terceiros não consigam influenciá-lo por comentários.
          include_comments_by_actor: "ronaldovieira2505-rgb,santoroo,gabrielmarinhorosa,claude[bot]"
          # Terminal restrito a uma lista de comandos. As instruções abaixo ensinam o
          # Claude a trabalhar dentro dela (sem venv, sem "cd", um comando por vez).
          # sonnet = mais leve para a cota do plano Pro. Troque por opus só em US difíceis.
          claude_args: |
            --model sonnet
            --max-turns 40
            --allowedTools "Edit,Write,Read,Glob,Grep,Bash(ls:*),Bash(mkdir:*),Bash(pip:*),Bash(pip3:*),Bash(python:*),Bash(python3:*),Bash(django-admin:*),Bash(pytest:*),Bash(ruff:*),Bash(npm:*),Bash(npx:*),Bash(node:*)"
            --append-system-prompt "Ambiente de execução (GitHub Actions): Python 3.12, Node LTS e PostgreSQL já estão prontos, e DATABASE_URL, SECRET_KEY, DEBUG e ALLOWED_HOSTS já estão no ambiente. Regras do terminal: (1) NÃO crie ambiente virtual; instale direto com 'pip install -r backend/requirements-dev.txt'. (2) Rode UM comando por vez, sem '&&', ';', '|' nem 'cd'. (3) Use caminhos ou flags no lugar de 'cd': 'python backend/manage.py <cmd>', 'pytest backend', 'ruff check backend', 'npm --prefix frontend install', 'npm --prefix frontend run lint', 'npm --prefix frontend test', 'npm --prefix frontend run build', 'npm create vite@latest frontend -- --template react-ts'. Configure o pytest para funcionar quando chamado da raiz (por exemplo, pytest.ini com rootdir/pythonpath apontando para backend). Se algum comando precisar de aprovação, não pare: procure a forma equivalente permitida."
