name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Descobre o que já existe no repositório. Enquanto backend/ e frontend/ não
  # existirem, o CI fica verde (os jobs abaixo são pulados).
  detect:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.d.outputs.backend }}
      frontend: ${{ steps.d.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6
      - id: d
        run: |
          if [ -f backend/manage.py ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          if [ -f frontend/package.json ]; then echo "frontend=true" >> "$GITHUB_OUTPUT"; else echo "frontend=false" >> "$GITHUB_OUTPUT"; fi

  backend:
    needs: detect
    if: needs.detect.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: conectaja
          POSTGRES_PASSWORD: conectaja
          POSTGRES_DB: conectaja
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U conectaja"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://conectaja:conectaja@localhost:5432/conectaja
      SECRET_KEY: ci-only-not-a-secret
      DEBUG: "false"
      ALLOWED_HOSTS: "*"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Instalar dependências
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations pendentes?
        run: python manage.py makemigrations --check --dry-run
      - name: Testes (pytest)
        run: pytest

  frontend:
    needs: detect
    if: needs.detect.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Único check obrigatório na proteção da main: falha se qualquer job acima falhar.
  ci-ok:
    if: always()
    needs: [detect, backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Resultado agregado
        run: |
          echo "detect=${{ needs.detect.result }} backend=${{ needs.backend.result }} frontend=${{ needs.frontend.result }}"
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            exit 1
          fi
